<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>東進八日市校｜共テカウントダウン</title>
<style>
:root{--bg:#0b0b0d;--text:#f7f7f7;--muted:#a7a7ad;--line:#2a2a2f;--accent:#d71920}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center}
.screen{width:100vw;height:100vh;min-height:320px;display:grid;grid-template-columns:46% 54%;position:relative}
.left,.right{display:flex;flex-direction:column;justify-content:center}
.left{padding:5vw;border-right:1px solid var(--line);position:relative}
.right{padding:5vw 6vw 5vw 6vw}
.school{font-size:clamp(12px,1.6vw,24px);font-weight:800;letter-spacing:.16em}
.title{margin-top:2vh;font-size:clamp(16px,2.2vw,34px);font-weight:700;color:#ddd}
.number{font-size:clamp(110px,19vw,300px);font-weight:950;line-height:.78;letter-spacing:-.08em;margin-top:4vh;font-variant-numeric:tabular-nums}
.days{font-size:clamp(17px,2.2vw,32px);font-weight:800;letter-spacing:.35em;margin-top:2vh}
.date{font-size:clamp(11px,1.3vw,19px);color:var(--muted);margin-top:1.5vh}
.label{font-size:clamp(11px,1.3vw,18px);font-weight:800;letter-spacing:.2em;color:var(--muted)}
.quote{font-size:clamp(22px,3.1vw,52px);font-weight:800;line-height:1.55;letter-spacing:-.03em;margin-top:2vh;max-width:900px}
.author{font-size:clamp(13px,1.6vw,22px);color:var(--muted);margin-top:2.5vh}
.rule{width:80px;height:4px;background:var(--accent);margin-top:3vh}
.clock{position:absolute;right:2vw;bottom:1.8vw;font-size:clamp(12px,1.4vw,20px);color:var(--muted);font-variant-numeric:tabular-nums}
.footer{position:absolute;left:5vw;bottom:2vw;font-size:clamp(10px,1.1vw,16px);color:var(--muted)}
@media(max-aspect-ratio:1/1){
  .screen{grid-template-columns:1fr;grid-template-rows:45% 55%;height:100vh}
  .left{border-right:0;border-bottom:1px solid var(--line);padding:5vh 7vw}
  .right{padding:4vh 7vw}
  .number{font-size:clamp(90px,27vw,180px);margin-top:2vh}
  .quote{font-size:clamp(20px,6vw,34px)}
  .footer{display:none}
}
</style>
</head>
<body>
<main class="screen" aria-label="東進八日市校 共通テストカウントダウン">
<section class="left">
  <div class="school">東進ハイスクール 八日市校</div>
  <div class="title">大学入学共通テストまで</div>
  <div id="days" class="number">---</div>
  <div class="days">DAYS</div>
  <div class="date">2027年1月16日（土）・17日（日）</div>
</section>
<section class="right">
  <div class="label">TODAY'S MESSAGE</div>
  <div id="quote" class="quote">今日という一日を大切に。</div>
  <div id="author" class="author">— 東進八日市校</div>
  <div class="rule"></div>
</section>
<div id="clock" class="clock">--:--:--</div>
<div class="footer">KEEP GOING. ONE DAY AT A TIME.</div>
</main>
<script>
const target = new Date("2027-01-16T00:00:00+09:00");
const quotes = [
  ["天才とは、1％のひらめきと99％の努力である。","トーマス・エジソン"],
  ["成功するまで続ければ、失敗ではない。","松下幸之助"],
  ["努力は必ず報われる。もし報われない努力があるのならば、それはまだ努力とは呼べない。","王貞治"],
  ["夢を見ることができるなら、あなたはそれを実現できる。","ウォルト・ディズニー"],
  ["成功とは、情熱を失わずに失敗から失敗へ進むことである。","ウィンストン・チャーチル"],
  ["できると思えばできる。できないと思えばできない。","パブロ・ピカソ"],
  ["何事も成し遂げるのは、始めることからだ。","マーク・トウェイン"],
  ["未来は、今日何をするかによって変わる。","マハトマ・ガンディー"],
  ["成功は結果ではなく、日々の積み重ねである。","東進八日市校"],
  ["小さな一歩の積み重ねが、大きな結果を生む。","東進八日市校"]
];

function dateKey(d){
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function update(){
  const now = new Date();
  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff = Math.max(0, Math.ceil((target-today)/86400000));
  document.getElementById("days").textContent = diff;
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const start = new Date(2026,0,1);
  const index = Math.abs(hash(dateKey(today))) % quotes.length;
  document.getElementById("quote").textContent = "「"+quotes[index][0]+"」";
  document.getElementById("author").textContent = "— "+quotes[index][1];
}
function hash(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
  return h;
}
update();
setInterval(update,1000);
</script>
</body>
</html>
